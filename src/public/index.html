<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burrow</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="titlebar">
        <div class="brand">
          <img src="/mascot.svg" alt="" width="22" height="22" />
          <span class="brand-name">Burrow</span>
        </div>
        <div class="titlebar-spacer"></div>
        <div class="titlebar-right">
          <button
            id="settings-btn"
            class="icon-btn hidden"
            type="button"
            title="Einstellungen"
            aria-label="Einstellungen"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
              />
            </svg>
          </button>
          <span id="status-badge" class="status status--idle">
            <span class="status-dot"></span>
            Bereit
          </span>
        </div>
      </header>

      <main class="content">
        <section id="live-view" class="live hidden">
          <div class="live-card">
            <img id="qr-image" alt="QR-Code" width="160" height="160" />
          </div>
          <p class="live-hint">Mit der Handy-Kamera scannen</p>
          <div class="url-field">
            <a id="tunnel-url" href="#" target="_blank" rel="noopener"></a>
            <button id="copy-btn" class="btn btn--copy" type="button">Kopieren</button>
          </div>
          <div class="stats">
            <div class="stat">
              <span class="stat-label">Rein</span>
              <span id="stat-in-count" class="stat-value">0</span>
              <span id="stat-in-size" class="stat-meta">0 B</span>
              <svg
                id="chart-in"
                class="stat-chart"
                viewBox="0 0 100 22"
                preserveAspectRatio="none"
                aria-hidden="true"
              ></svg>
            </div>
            <div class="stat">
              <span class="stat-label">Raus</span>
              <span id="stat-out-count" class="stat-value">0</span>
              <span id="stat-out-size" class="stat-meta">0 B</span>
              <svg
                id="chart-out"
                class="stat-chart"
                viewBox="0 0 100 22"
                preserveAspectRatio="none"
                aria-hidden="true"
              ></svg>
            </div>
            <div class="stat stat--active">
              <span class="stat-label">Aktiv</span>
              <span id="stat-active" class="stat-value">0</span>
              <svg
                id="chart-active"
                class="stat-chart stat-chart--active"
                viewBox="0 0 100 22"
                preserveAspectRatio="none"
                aria-hidden="true"
              ></svg>
            </div>
          </div>
          <button id="stop-btn" class="btn btn--stop btn--wide" type="button" disabled>
            Tunnel beenden
          </button>
        </section>

        <section id="home-view" class="home">
          <div class="hero">
            <img src="/mascot.svg" alt="Mo, der Maulwurf" width="92" height="88" />
            <p id="hero-line" class="hero-line">Mo gräbt dir einen Tunnel zum Handy.</p>
          </div>
          <section id="setup-section" class="panel">
            <div class="panel-head">
              <span class="panel-label">ngrok verbinden</span>
            </div>
            <form id="config-form" class="row">
              <input
                type="password"
                id="authtoken"
                placeholder="Authtoken"
                autocomplete="off"
                spellcheck="false"
              />
              <button type="submit" class="btn">Speichern</button>
            </form>
            <p class="note">
              <a href="https://dashboard.ngrok.com/signup" target="_blank" rel="noopener"
                >Account erstellen</a
              >
              ·
              <a
                href="https://dashboard.ngrok.com/get-started/your-authtoken"
                target="_blank"
                rel="noopener"
                >Token holen</a
              >
            </p>
          </section>

          <section id="tunnel-section" class="panel">
            <div class="panel-head">
              <span class="panel-label">Lokalen Server teilen</span>
            </div>
            <div class="row">
              <span class="field-label">Port</span>
              <input
                type="text"
                id="target-port"
                class="port-input"
                inputmode="numeric"
                placeholder="3000"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
              />
              <button id="start-btn" class="btn btn--accent" disabled>Starten</button>
            </div>
            <p class="note">Dev-Server muss bereits laufen.</p>
          </section>
        </section>

        <section id="settings-panel" class="settings hidden">
          <div class="panel-head">
            <span class="panel-label">Einstellungen</span>
            <button id="settings-close" class="text-btn" type="button">Zurück</button>
          </div>
          <form id="settings-form" class="stack">
            <label class="field-label" for="settings-authtoken">Authtoken</label>
            <input
              type="password"
              id="settings-authtoken"
              placeholder="Neuen Token einfügen…"
              autocomplete="off"
              spellcheck="false"
            />
            <label class="field-label" for="settings-port">Standard-Port</label>
            <input
              type="text"
              id="settings-port"
              class="port-input"
              inputmode="numeric"
              placeholder="3000"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
            />
            <button type="submit" class="btn btn--accent">Speichern</button>
          </form>
          <p class="note">
            <a
              href="https://dashboard.ngrok.com/get-started/your-authtoken"
              target="_blank"
              rel="noopener"
              >Token auf ngrok.com</a
            >
          </p>
        </section>
      </main>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
